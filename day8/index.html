<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
</head>

<body>

    <h1>Student Management System</h1>

    <label for="studentName">Student Name</label>
    <input type="text" id="studentName" placeholder="Student Name">

    <br><br>

    <label for="rollNo">Roll No.</label>
    <input type="number" id="rollNo" placeholder="Roll No.">

    <br><br>

    <label for="course">Course</label>
    <select id="course">
        <option value="BCA">BCA</option>
        <option value="MCA">MCA</option>
        <option value="BBA">BBA</option>
        <option value="B.Tech">B.Tech</option>
    </select>

    <br><br>

    <label for="marks">Marks</label>
    <input type="number" id="marks" placeholder="Marks" min="0" max="100">

    <br><br>

    <button onclick="addStudent()">Add Student</button>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>
    </table>


    <script>

        function addStudent() {

            // Get input values
            let name = document.getElementById("studentName").value;
            let rollNo = document.getElementById("rollNo").value;
            let course = document.getElementById("course").value;
            let marks = Number(document.getElementById("marks").value);

            // Check input
            if (name === "" || rollNo === "" || marks === "") {
                alert("Please enter all details");
                return;
            }

            // Calculate grade
            let grade;

            if (marks >= 90) {
                grade = "A+";
            }
            else if (marks >= 80) {
                grade = "A";
            }
            else if (marks >= 70) {
                grade = "B+";
            }
            else if (marks >= 60) {
                grade = "B";
            }
            else if (marks >= 50) {
                grade = "C";
            }
            else if (marks >= 40) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Create new row
            let row = document.createElement("tr");

            // Put student data inside row
            row.innerHTML = `
                <td>${rollNo}</td>
                <td>${name}</td>
                <td>${course}</td>
                <td>${marks}</td>
                <td>${grade}</td>
                <td>
                    <button onclick="this.parentElement.parentElement.remove()">
                        Delete
                    </button>
                </td>
            `;

            // Add row to table
            document.getElementById("studentTable").appendChild(row);

            // Clear input fields
            document.getElementById("studentName").value = "";
            document.getElementById("rollNo").value = "";
            document.getElementById("marks").value = "";
        }

    </script>

</body>
</html>
